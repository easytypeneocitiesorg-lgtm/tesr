
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0506">
  <title>Crimson AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0506;
      --panel: #12090b;
      --panel-light: #1a0d0f;
      --border: #3a1a1f;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --text: #f8eeee;
      --muted: #a18a8d;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: .8;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(239, 68, 68, .13);
      background: rgba(11, 5, 6, .7);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -.8px;
      font-size: 19px;
    }

    .brand-name {
      background: linear-gradient(110deg, #fff 20%, #ffb4b4 70%, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #f04444, #991b1b);
      box-shadow: 0 0 25px #ef444433, inset 0 1px #ffffff30;
      animation: logoFloat 4s ease-in-out infinite;
    }

    .logo svg {
      width: 23px;
      height: 23px;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-button,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #170b0d;
      color: #d8c5c7;
      cursor: pointer;
      transition: .2s ease;
    }

    .header-button {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
    }

    .header-button:hover,
    .icon-button:hover {
      border-color: #8e3038;
      background: #251014;
      color: white;
    }

    .icon-button {
      width: 37px;
      height: 37px;
    }

    .icon-button svg,
    .header-button svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .welcome {
      width: min(760px, 100%);
      margin: auto 0;
      padding: 35px 24px;
      text-align: center;
      animation: fadeIn .6s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border: 1px solid #7d252c;
      border-radius: 25px;
      background: linear-gradient(145deg, #351114, #17080a);
      box-shadow: 0 0 65px #ef44441a, inset 0 1px #ffffff12;
    }

    .welcome-logo svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 0 12px #ef444455);
    }

    h1 {
      margin: 0;
      font-size: clamp(35px, 6vw, 55px);
      letter-spacing: -2.8px;
      line-height: 1.15;
      font-weight: 800;
      background: linear-gradient(115deg, #fff 10%, #ffd4d4 55%, #ef4444 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      max-width: 470px;
      margin: 17px auto 29px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
    }

    .suggestion {
      min-height: 76px;
      text-align: left;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(25, 12, 14, .8);
      cursor: pointer;
      transition: .2s ease;
    }

    .suggestion:hover {
      transform: translateY(-2px);
      background: #241013;
      border-color: #7c2b32;
    }

    .suggestion strong {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
      color: #f6e6e7;
    }

    .suggestion span {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .chat {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      width: 100%;
      padding: 35px 22px 25px;
      scrollbar-width: thin;
      scrollbar-color: #542127 transparent;
    }

    .chat.active {
      display: block;
    }

    .messages {
      max-width: 790px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .message {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      animation: fadeIn .25s ease both;
      min-width: 0;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #1a0c0e;
      color: #f87171;
      font-size: 13px;
      font-weight: 800;
    }

    .message.user .avatar {
      color: white;
      background: #702027;
      border-color: #87323a;
    }

    .message-content {
      min-width: 0;
      flex: 1;
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
      margin: 2px 0 10px;
      color: #f6e5e6;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.85;
      color: #dfd0d1;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-text code {
      background: #291216;
      border: 1px solid #472026;
      border-radius: 5px;
      padding: 2px 5px;
      font-family: Consolas, monospace;
      font-size: .92em;
    }

    .message-text pre {
      position: relative;
      overflow-x: auto;
      padding: 17px;
      margin: 13px 0;
      border: 1px solid #482027;
      border-radius: 12px;
      background: #0c0708;
    }

    .message-text pre code {
      padding: 0;
      border: none;
      background: transparent;
      white-space: pre;
    }

    .message-tools {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .message-tools button {
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #8f777a;
      font-size: 11px;
      cursor: pointer;
    }

    .message-tools button:hover {
      color: #ffb4b4;
      border-color: var(--border);
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 24px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .45; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .composer-area {
      flex-shrink: 0;
      width: min(820px, 100%);
      padding: 12px 20px 20px;
      margin: 0 auto;
    }

    .composer {
      border: 1px solid #4b2026;
      border-radius: 19px;
      background: rgba(24, 12, 14, .94);
      box-shadow: 0 12px 50px #00000035, 0 0 25px #ef444408;
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #87333b;
      box-shadow: 0 0 0 3px #ef44440c, 0 12px 50px #00000035;
    }

    #prompt {
      display: block;
      width: 100%;
      min-height: 65px;
      max-height: 200px;
      padding: 19px 19px 8px;
      resize: none;
      outline: none;
      border: none;
      background: transparent;
      color: #fff0f0;
      font-size: 14px;
      line-height: 1.65;
    }

    #prompt::placeholder {
      color: #806c6f;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px 11px 16px;
    }

    .model-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a89194;
      font-size: 11px;
      font-weight: 600;
    }

    .claude-mark {
      width: 17px;
      height: 17px;
      color: #f87171;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .hint {
      font-size: 10px;
      color: #725d60;
    }

    #send {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid #f45b5b;
      border-radius: 12px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 15px #ef444420;
      transition: .2s;
    }

    #send:hover {
      filter: brightness(1.13);
      transform: translateY(-1px);
    }

    #send:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    #send svg {
      width: 15px;
      height: 15px;
    }

    .disclaimer {
      margin-top: 11px;
      text-align: center;
      color: #6f5b5e;
      font-size: 10px;
      line-height: 1.5;
    }

    .tools-wrap {
      position: fixed;
      z-index: 10;
      bottom: 20px;
      left: 20px;
    }

    .tools-button {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border: 1px solid #54232a;
      border-radius: 15px;
      background: rgba(27, 12, 15, .95);
      color: #f1b3b7;
      cursor: pointer;
      box-shadow: 0 5px 25px #00000035;
      transition: .2s;
    }

    .tools-button:hover {
      border-color: #a33a43;
      background: #291014;
      transform: translateY(-2px);
    }

    .tools-button svg {
      width: 20px;
      height: 20px;
    }

    .tools-menu {
      position: absolute;
      bottom: 56px;
      left: 0;
      width: 190px;
      padding: 7px;
      border: 1px solid #492027;
      border-radius: 15px;
      background: rgba(22, 10, 12, .98);
      box-shadow: 0 12px 45px #00000070;
      backdrop-filter: blur(20px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(.97);
      transform-origin: bottom left;
      transition: .18s ease;
    }

    .tools-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .tools-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #d7c3c6;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
    }

    .tools-menu button:hover {
      background: #301317;
      color: white;
    }

    .tools-menu button svg {
      width: 16px;
      height: 16px;
      color: #ed777d;
    }

    .tools-divider {
      height: 1px;
      background: #392025;
      margin: 5px 4px;
    }

    .toast {
      position: fixed;
      z-index: 20;
      top: 85px;
      left: 50%;
      transform: translate(-50%, -8px);
      padding: 11px 16px;
      border: 1px solid #633038;
      border-radius: 12px;
      background: #1d0d10;
      color: #ffe6e7;
      font-size: 12px;
      box-shadow: 0 8px 30px #00000050;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      header {
        height: 60px;
        padding: 0 14px;
      }

      .brand { font-size: 17px; }
      .header-button { padding: 9px; }
      .header-button span { display: none; }

      .welcome {
        padding: 25px 17px;
      }

      .welcome-logo {
        width: 65px;
        height: 65px;
        border-radius: 21px;
      }

      h1 {
        letter-spacing: -1.7px;
      }

      .subtitle {
        font-size: 13px;
      }

      .suggestions {
        gap: 8px;
      }

      .suggestion {
        padding: 12px;
      }

      .chat {
        padding: 24px 14px;
      }

      .composer-area {
        padding: 10px 12px 14px;
      }

      .tools-wrap {
        bottom: 14px;
        left: 12px;
      }

      .tools-button {
        width: 40px;
        height: 40px;
      }

      .composer-bottom {
        padding-left: 12px;
      }

      .hint {
        display: none;
      }

      .disclaimer {
        font-size: 9px;
        padding: 0 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>

  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 3L19.2 11.8L28 15L19.2 18.2L16 27L12.8 18.2L4 15L12.8 11.8L16 3Z"
              fill="white"/>
            <path d="M25 21L26.4 24.6L30 26L26.4 27.4L25 31L23.6 27.4L20 26L23.6 24.6L25 21Z"
              fill="#ffd0d0"/>
          </svg>
        </div>
        <span class="brand-name">Crimson AI</span>
      </div>

      <div class="header-actions">
        <button class="header-button" id="exportTop" title="Export conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>
          </svg>
          <span>Export</span>
        </button>

        <button class="header-button" id="newChatTop" title="Start a new chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>
      </div>
    </header>

    <main>
      <section class="welcome" id="welcome">
        <div class="welcome-logo">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 2L20 12L30 16L20 20L16 30L12 20L2 16L12 12L16 2Z"
              fill="#ff7777"/>
            <path d="M16 8L18.7 14L24 16L18.7 18L16 24L13.3 18L8 16L13.3 14L16 8Z"
              fill="#fff2f2"/>
          </svg>
        </div>

        <h1>Think without limits.</h1>

        <p class="subtitle">
          Your ideas, your questions, your next big project.
          Let's figure it out together.
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me brainstorm a creative project idea.">
            <strong>✦ Brainstorm ideas</strong>
            <span>Turn a random thought into something real.</span>
          </button>

          <button class="suggestion" data-prompt="Help me write clean, well-organized code for a project.">
            <strong>⌘ Build something</strong>
            <span>Work through code and technical problems.</span>
          </button>

          <button class="suggestion" data-prompt="Explain a complicated topic in simple terms, step by step.">
            <strong>◈ Learn something</strong>
            <span>Make difficult topics easier to understand.</span>
          </button>

          <button class="suggestion" data-prompt="Give me a few interesting ideas for something fun to do.">
            <strong>↗ Explore possibilities</strong>
            <span>Find a fresh angle or a new direction.</span>
          </button>
        </div>
      </section>

      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-area">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Crimson AI..."></textarea>

          <div class="composer-bottom">
            <div class="model-label">
              <svg class="claude-mark" viewBox="0 0 24 24" fill="currentColor" aria-label="Claude">
                <path d="M12.1 2.2c.5 0 .9.3 1.1.8l7.1 16.5a1.2 1.2 0 0 1-2.2.9l-1.8-4.2H7.9l-1.8 4.2a1.2 1.2 0 1 1-2.2-.9L11 3c.2-.5.6-.8 1.1-.8Zm0 4.5-3.2 7.2h6.3l-3.1-7.2Z"/>
              </svg>
              <span>Claude Haiku 5.5</span>
            </div>

            <div class="composer-actions">
              <span class="hint">Enter to send · Shift + Enter for newline</span>
              <button id="send">
                <span>Send</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="disclaimer">
          AI can make mistakes. Double-check important information.
        </div>
      </div>
    </main>
  </div>

  <div class="tools-wrap">
    <div class="tools-menu" id="toolsMenu">
      <button id="newChatMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New conversation
      </button>

      <button id="exportMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>
        </svg>
        Export conversation
      </button>

      <button id="clearMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>
        </svg>
        Clear conversation
      </button>

      <div class="tools-divider"></div>

      <button id="aboutMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11v5m0-8h.01"/>
        </svg>
        About Crimson AI
      </button>
    </div>

    <button class="tools-button" id="toolsButton" aria-label="Open tools menu" title="Tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8Z"
          transform="translate(-1 -1)"/>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // API CONFIGURATION
    // Paste your OpenRouter API key between the quotation marks.
    // Example format: sk-or-v1-...
    // ============================================================

    const API_KEY = "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";

    const MODEL = "anthropic/claude-haiku-5.5";
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    // ============================================================
    // APPLICATION STATE
    // ============================================================

    const conversation = [];
    let busy = false;
    let typingElement = null;
    let toastTimeout = null;

    const $ = (selector) => document.querySelector(selector);

    const welcome = $("#welcome");
    const chat = $("#chat");
    const messages = $("#messages");
    const promptInput = $("#prompt");
    const sendButton = $("#send");
    const toolsMenu = $("#toolsMenu");
    const toolsButton = $("#toolsButton");
    const toastElement = $("#toast");

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.add("show");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastElement.classList.remove("show");
      }, 2600);
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      sendButton.querySelector("span").textContent = value ? "Thinking..." : "Send";
    }

    function showChat() {
      welcome.style.display = "none";
      chat.classList.add("active");
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    // Lightweight Markdown formatting for messages.
    function formatMessage(text) {
      let result = escapeHTML(text);

      result = result.replace(
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,
        (_, language, code) =>
          `<pre><code>${code.trim()}</code></pre>`
      );

      result = result.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      result = result.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      result = result.replace(/\*(.+?)\*/g, "<em>$1</em>");
      result = result.replace(/\n/g, "<br>");

      // Restore newlines inside code blocks.
      result = result.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,
        (_, code) => `<pre><code>${code.replace(/&lt;br&gt;/g, "\n")}</code></pre>`);

      return result;
    }

    function addMessage(role, content, options = {}) {
      showChat();

      const wrapper = document.createElement("article");
      wrapper.className = `message ${role === "user" ? "user" : "assistant"}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "Y" : "✦";

      const body = document.createElement("div");
      body.className = "message-content";

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = role === "user" ? "You" : "Crimson AI";

      const text = document.createElement("div");
      text.className = "message-text";
      text.innerHTML = formatMessage(content);

      body.append(name, text);

      if (role === "assistant" && !options.typing) {
        const tools = document.createElement("div");
        tools.className = "message-tools";

        const copyButton = document.createElement("button");
        copyButton.textContent = "Copy";
        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(content);
            showToast("Response copied");
          } catch {
            showToast("Couldn't access clipboard");
          }
        });

        tools.append(copyButton);
        body.append(tools);
      }

      wrapper.append(avatar, body);
      messages.append(wrapper);

      scrollToBottom();
      return wrapper;
    }

    function showTyping() {
      const wrapper = document.createElement("article");
      wrapper.className = "message assistant";

      wrapper.innerHTML = `
        <div class="avatar">✦</div>
        <div class="message-content">
          <div class="message-name">Crimson AI</div>
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;

      messages.append(wrapper);
      typingElement = wrapper;
      scrollToBottom();
    }

    function removeTyping() {
      if (typingElement) {
        typingElement.remove();
        typingElement = null;
      }
    }

    // ============================================================
    // OPENROUTER CHAT REQUEST
    // ============================================================

    async function sendMessage() {
      const content = promptInput.value.trim();

      if (!content || busy) return;

      if (!API_KEY || API_KEY === "PASTE_YOUR_OPENROUTER_API_KEY_HERE") {
        showToast("Add your OpenRouter API key in the code first.");
        return;
      }

      promptInput.value = "";
      promptInput.style.height = "auto";

      conversation.push({
        role: "user",
        content
      });

      addMessage("user", content);
      setBusy(true);
      showTyping();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: conversation,
            temperature: 0.7
          })
        });

        const rawBody = await response.text();

        let data;

        try {
          data = JSON.parse(rawBody);
        } catch {
          throw new Error(
            `OpenRouter returned an unexpected response (HTTP ${response.status}).`
          );
        }

        if (!response.ok) {
          const message =
            data?.error?.message ||
            data?.message ||
            `HTTP ${response.status}`;

          throw new Error(`${message} (HTTP ${response.status})`);
        }

        const answer = data?.choices?.[0]?.message?.content;

        if (typeof answer !== "string" || !answer.trim()) {
          throw new Error("The model returned an empty response.");
        }

        conversation.push({
          role: "assistant",
          content: answer
        });

        removeTyping();
        addMessage("assistant", answer);

      } catch (error) {
        removeTyping();

        console.error("Crimson AI request failed:", error);

        let message = error.message || "Unknown error";

        if (error instanceof TypeError) {
          message =
            "Network request failed. Check your internet connection and browser console. The browser may also be blocking the request.";
        }

        addMessage(
          "assistant",
          `**Request failed**\n\n${message}\n\nCheck your OpenRouter API key, model ID, and browser network permissions.`
        );

      } finally {
        setBusy(false);
        promptInput.focus();
      }
    }

    // ============================================================
    // CHAT CONTROLS
    // ============================================================

    function newChat() {
      if (busy) {
        showToast("Wait for the current response to finish.");
        return;
      }

      conversation.length = 0;
      messages.replaceChildren();
      chat.classList.remove("active");
      welcome.style.display = "";
      promptInput.value = "";
      promptInput.style.height = "auto";
      toolsMenu.classList.remove("open");
      promptInput.focus();
    }

    function exportConversation() {
      if (conversation.length === 0) {
        showToast("There's no conversation to export yet.");
        return;
      }

      const output = conversation.map((message) => {
        const heading = message.role === "user" ? "You" : "Crimson AI";
        return `${heading}\n${message.content}`;
      }).join("\n\n------------------------------\n\n");

      const blob = new Blob([output], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = `crimson-ai-chat-${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      showToast("Conversation exported");
      toolsMenu.classList.remove("open");
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================

    sendButton.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height =
        Math.min(promptInput.scrollHeight, 200) + "px";
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => {
        promptInput.value = button.dataset.prompt || "";
        promptInput.focus();
        promptInput.dispatchEvent(new Event("input"));
      });
    });

    toolsButton.addEventListener("click", (event) => {
      event.stopPropagation();
      toolsMenu.classList.toggle("open");
    });

    toolsMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    document.addEventListener("click", () => {
      toolsMenu.classList.remove("open");
    });

    $("#newChatTop").addEventListener("click", newChat);
    $("#newChatMenu").addEventListener("click", newChat);

    $("#exportTop").addEventListener("click", exportConversation);
    $("#exportMenu").addEventListener("click", exportConversation);

    $("#clearMenu").addEventListener("click", () => {
      if (busy) {
        showToast("Wait for the current response to finish.");
        return;
      }

      conversation.length = 0;
      messages.replaceChildren();
      chat.classList.remove("active");
      welcome.style.display = "";
      toolsMenu.classList.remove("open");
      showToast("Conversation cleared");
    });

    $("#aboutMenu").addEventListener("click", () => {
      toolsMenu.classList.remove("open");
      showToast("Crimson AI · Powered by OpenRouter");
    });

    // ============================================================
    // INTERACTIVE RED PARTICLE BACKGROUND
    // ============================================================

    const canvas = $("#particles");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let particles = [];
    let mouse = { x: -1000, y: -1000 };
    let animationFrame;

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * ratio);
      canvas.height = Math.floor(height * ratio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      const count = Math.min(
        115,
        Math.max(35, Math.floor((width * height) / 12500))
      );

      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        radius: Math.random() * 1.5 + 0.5
      }));
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);

      const connectionDistance = width < 600 ? 90 : 130;
      const mouseDistance = 115;

      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;

        if (particle.x < 0 || particle.x > width) particle.vx *= -1;
        if (particle.y < 0 || particle.y > height) particle.vy *= -1;

        const dx = particle.x - mouse.x;
        const dy = particle.y - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouseDistance && distance > 0) {
          const force = (mouseDistance - distance) / mouseDistance;
          particle.x += (dx / distance) * force * 1.6;
          particle.y += (dy / distance) * force * 1.6;
        }

        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(248, 75, 85, 0.65)";
        ctx.fill();
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i];
          const b = particles[j];

          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < connectionDistance) {
            const opacity = (1 - distance / connectionDistance) * 0.2;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(220, 45, 58, ${opacity})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
      }

      animationFrame = requestAnimationFrame(animateParticles);
    }

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    window.addEventListener("pointerleave", () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    resizeCanvas();
    animateParticles();
  </script>
</body>
</html>
