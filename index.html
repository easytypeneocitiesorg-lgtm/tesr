<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabspace AI</title>
<link rel="icon" href="https://core-logic-utils.github.io/assets/tabspacelogo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#0b0506;--panel:#1a0d0f;--panel2:#241216;--border:#3a1a1f;--accent:#ef4444;--dark:#b91c1c;--glow:rgba(239,68,68,.35);--muted:#8b6f73}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:'Inter',sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* header */
header{display:flex;align-items:center;gap:10px;padding:14px 18px}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;margin-right:auto}
header .brand img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 10px var(--glow))}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(26,13,15,.8);backdrop-filter:blur(10px);border:1px solid var(--border);color:#fff;border-radius:12px;cursor:pointer;font-size:.95rem;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.icon-btn:hover{border-color:var(--accent);background:rgba(60,20,26,.9);transform:translateY(-1px);box-shadow:0 0 14px var(--glow)}

/* chat area */
#chat{flex:1;overflow-y:auto;padding:8px 18px 24px;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto}
#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
#empty img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 26px var(--glow));animation:float 5s ease-in-out infinite}
#empty h1{margin:14px 0 6px;font-size:3rem;font-weight:700;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 30%,#fca5a5 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{margin:0 0 22px;color:var(--muted)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{background:rgba(26,13,15,.8);backdrop-filter:blur(10px);border:1px solid var(--border);color:#e7d5d7;font:inherit;font-size:.85rem;padding:9px 14px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.chip:hover{border-color:var(--accent);background:rgba(239,68,68,.15);transform:translateY(-2px)}

/* messages */
.msg{display:flex;margin:14px 0;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:12px 16px;border-radius:18px;line-height:1.6;font-size:.95rem;overflow-wrap:anywhere}
.user .bubble{background:linear-gradient(145deg,var(--accent),var(--dark));border-bottom-right-radius:6px;white-space:pre-wrap;box-shadow:0 6px 18px rgba(185,28,28,.3)}
.bot .bubble{background:rgba(26,13,15,.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-bottom-left-radius:6px}
.bubble.err{border-color:var(--accent);color:#fca5a5}
.bubble p{margin:0 0 .7em}.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{margin:.9em 0 .4em;font-size:1.05rem}
.bubble ul,.bubble ol{margin:.3em 0 .7em;padding-left:1.4em}
.bubble code{background:var(--panel2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.85em;font-family:ui-monospace,Menlo,Consolas,monospace}
.bubble pre{position:relative;margin:.7em 0;background:#120709;border:1px solid var(--border);border-radius:12px;padding:12px 14px;overflow-x:auto}
.bubble pre code{background:none;border:none;padding:0;font-size:.82rem}
.copy{position:absolute;top:8px;right:8px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.35);color:#fff;font:inherit;font-size:.7rem;padding:3px 8px;border-radius:8px;cursor:pointer}
.copy:hover{background:rgba(239,68,68,.45)}
.bubble a{color:#fca5a5}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}

/* input */
#bar{padding:0 18px 20px}
#box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:rgba(26,13,15,.85);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:24px;padding:8px 8px 8px 18px;transition:border-color .2s,box-shadow .2s}
#box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
#input{flex:1;background:none;border:none;outline:none;resize:none;color:#fff;font:inherit;font-size:.95rem;line-height:1.5;max-height:180px;padding:8px 0}
#input::placeholder{color:var(--muted)}
#send{width:40px;height:40px;flex:none;border:none;border-radius:14px;cursor:pointer;color:#fff;font-size:.95rem;background:linear-gradient(145deg,var(--accent),var(--dark));box-shadow:0 4px 14px rgba(185,28,28,.4);transition:transform .2s,box-shadow .2s,opacity .2s}
#send:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--glow)}
#send:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
#note{text-align:center;color:var(--muted);font-size:.72rem;margin:8px 0 0}

::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){#empty h1{font-size:2.3rem}.bubble{max-width:94%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <header>
    <div class="brand"><img src="https://core-logic-utils.github.io/assets/tabspacelogo.png" alt=""><span>Tabspace AI</span></div>
    <button class="icon-btn" id="newBtn" title="New chat" aria-label="New chat"><i class="fa-solid fa-plus"></i></button>
  </header>

  <div id="chat"><div class="col" id="msgs"></div></div>

  <div id="bar">
    <div id="box">
      <textarea id="input" rows="1" placeholder="Message Tabspace AI..." autocomplete="off"></textarea>
      <button id="send" aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
    <p id="note">AI can make mistakes. Check important info.</p>
  </div>
</div>

<script>
// ===================== EDIT HERE =====================
// Put your Vercel project URL here (no trailing slash), e.g. "https://tabspace-api.vercel.app"
const CONFIG = {
  API_URL: "https://aiback-ten.vercel.app",
  SUGGESTIONS: [
    "Explain how the internet works",
    "Help me write a polite email",
    "Give me a quick workout plan",
    "Write a Python function to sort a list"
  ]
};
// =====================================================

const $ = id => document.getElementById(id);
const chat = $('chat'), msgs = $('msgs'), input = $('input'), sendBtn = $('send');
let history = [], busy = false, controller = null;

/* ---------- markdown (small, safe renderer) ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(text){
  const parts = esc(text).split(/```/);
  let out = '';
  parts.forEach((part, i) => {
    if (i % 2) { // code block (an unclosed fence still renders while streaming)
      const code = part.replace(/^[^\n]*\n/, '');
      out += '<pre><button class="copy">Copy</button><code>' + code.replace(/\n$/,'') + '</code></pre>';
      return;
    }
    let html = '', list = null;
    const close = () => { if (list) { html += '</' + list + '>'; list = null; } };
    part.split('\n').forEach(line => {
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); html += '<h3>' + inline(m[1]) + '</h3>'; }
      else if (line.trim() === '') close();
      else { close(); html += '<p>' + inline(line) + '</p>'; }
    });
    close();
    out += html;
  });
  return out;
}
msgs.addEventListener('click', e => {
  if (!e.target.classList.contains('copy')) return;
  const code = e.target.parentElement.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => { e.target.textContent = 'Copied'; setTimeout(()=>e.target.textContent='Copy',1500); });
});

/* ---------- UI helpers ---------- */
function showEmpty(){
  msgs.innerHTML = '<div id="empty"><img src="https://core-logic-utils.github.io/assets/tabspacelogo.png" alt=""><h1>Tabspace AI</h1><p>Ask me anything.</p><div class="chips" id="chips"></div></div>';
  CONFIG.SUGGESTIONS.forEach(s => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = s;
    b.onclick = () => send(s); $('chips').appendChild(b);
  });
}
function addMsg(role, html, cls){
  if ($('empty')) msgs.innerHTML = '';
  const row = document.createElement('div'); row.className = 'msg ' + role;
  const b = document.createElement('div'); b.className = 'bubble' + (cls ? ' ' + cls : '');
  if (role === 'user') b.textContent = html; else b.innerHTML = html;
  row.appendChild(b); msgs.appendChild(row); scroll();
  return b;
}
const scroll = () => { chat.scrollTop = chat.scrollHeight; };
function setBusy(v){
  busy = v;
  sendBtn.innerHTML = v ? '<i class="fa-solid fa-stop"></i>' : '<i class="fa-solid fa-arrow-up"></i>';
}
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.onclick = () => busy ? controller && controller.abort() : send();
$('newBtn').onclick = () => { if (controller) controller.abort(); history = []; showEmpty(); input.focus(); };

/* ---------- OpenRouter streaming ---------- */
async function send(text){
  text = (text ?? input.value).trim();
  if (!text || busy) return;

  if (CONFIG.API_URL.toLowerCase().includes('your-project')) { addMsg('bot', 'Set <code>API_URL</code> in index.html to your Vercel project URL first.', 'err'); return; }
  input.value = ''; input.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const bubble = addMsg('bot', '<div class="dots"><span></span><span></span><span></span></div>');
  let reply = '';
  controller = new AbortController();
  setBusy(true);

  try {
    const res = await fetch(CONFIG.API_URL + '/api/chat', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'text/plain' },   // plain text avoids a CORS preflight request
      body: JSON.stringify({ messages: history })
    });

    if (!res.ok) {
      let msg = 'Request failed (' + res.status + ').';
      try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch(e){}
      throw new Error(msg);
    }

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;          // skips ": OPENROUTER PROCESSING" keep-alives
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        let j; try { j = JSON.parse(data); } catch(e){ continue; }
        if (j.error) throw new Error(j.error.message || 'The model returned an error.');
        const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (delta) { reply += delta; bubble.innerHTML = md(reply); scroll(); }
      }
    }
    if (!reply) bubble.innerHTML = '<p>No response received. Try again.</p>';
    else history.push({ role: 'assistant', content: reply });
  } catch (err) {
    if (err.name === 'AbortError') {
      if (reply) history.push({ role: 'assistant', content: reply });
      else { history.pop(); bubble.parentElement.remove(); }
    } else {
      history.pop();
      bubble.classList.add('err');
      bubble.textContent = err instanceof TypeError
        ? "Can't reach the proxy. Check that API_URL is correct and the proxy app is running."
        : (err.message || 'Something went wrong.');
    }
  } finally {
    setBusy(false); controller = null; input.focus();
  }
}

/* ---------- interactive particle background ---------- */
const cv = $('bg'), ctx = cv.getContext('2d');
let parts = [], mouse = { x: null, y: null, r: 120 };
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
class P {
  constructor(){
    this.x = Math.random()*cv.width; this.y = Math.random()*cv.height;
    this.s = Math.random()*2.2+.8; this.d = Math.random()*25+8;
    this.vx = (Math.random()-.5)*.4; this.vy = (Math.random()-.5)*.4;
    this.c = `rgba(239,68,68,${Math.random()*.5+.25})`;
  }
  step(){
    this.x += this.vx; this.y += this.vy;
    if (this.x<0) this.x = cv.width; if (this.x>cv.width) this.x = 0;
    if (this.y<0) this.y = cv.height; if (this.y>cv.height) this.y = 0;
    if (mouse.x !== null) {
      const dx = mouse.x-this.x, dy = mouse.y-this.y, dist = Math.hypot(dx,dy);
      if (dist < mouse.r) { const f = (mouse.r-dist)/mouse.r*this.d*.35; this.x -= dx/dist*f; this.y -= dy/dist*f; }
    }
    ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fillStyle = this.c; ctx.fill();
  }
}
function initP(){ parts = Array.from({length: Math.min(Math.floor(cv.width*cv.height/9000),140)}, () => new P()); }
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => p.step());
  for (let a=0;a<parts.length;a++) for (let b=a+1;b<parts.length;b++) {
    const d = Math.hypot(parts[a].x-parts[b].x, parts[a].y-parts[b].y);
    if (d < 110) {
      ctx.strokeStyle = `rgba(239,68,68,${(1-d/110)*.18})`; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(parts[a].x,parts[a].y); ctx.lineTo(parts[b].x,parts[b].y); ctx.stroke();
    }
  }
  requestAnimationFrame(loop);
}
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseout', () => { mouse.x = mouse.y = null; });
addEventListener('resize', () => { size(); initP(); });
size(); initP(); loop();

showEmpty();
</script>
</body>
</html>
